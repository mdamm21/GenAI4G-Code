[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genai4g"
version = "0.1.0"
description = "GenAI4G — Claude agent with MCP server skills"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.54.0",
    "claude-agent-sdk>=0.1.0",
    "mcp[cli]>=1.0.0",
    "anyio>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
genai4g-server = "genai4g.server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["src/genai4g"]
